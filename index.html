<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Browser-only AI avatar chat powered by Chrome Built-in AI, Piper TTS, and PNGTuber avatars." />
    <meta name="theme-color" content="#0F1117" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/avatars/default/mouth_close_eyes_open.png" type="image/png" />
    <link rel="apple-touch-icon" href="/avatars/default/mouth_close_eyes_open.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Avatar Chrome</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
